<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLVACC — Zapisy na wydarzenia</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1220;
      --card: #121b2e;
      --text: #e8edf7;
      --muted: #94a3b8;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      max-width: 560px;
      margin: 24px;
      padding: 40px;
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }
    p {
      color: var(--muted);
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>PLVACC — Zapisy na wydarzenia</h1>
    <p>
      Interaktywny system zapisów na wydarzenia dla kontrolerów Polish VACC.
      Strona jest w trakcie budowy — wróć wkrótce.
    </p>
    <span class="badge">🚧 W budowie</span>
  </div>
</body>
</html>
